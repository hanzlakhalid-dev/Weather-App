<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="128"
     height="128"
     fill="none">

  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FFF8B0"/>
      <stop offset="60%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sun Rays -->
  <g stroke="#F9A825"
     stroke-width="2.8"
     stroke-linecap="round"
     opacity="0.95">

    <line x1="32" y1="6"  x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="58"/>

    <line x1="6"  y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="58" y2="32"/>

    <line x1="14.2" y1="14.2" x2="19.8" y2="19.8"/>
    <line x1="44.2" y1="44.2" x2="49.8" y2="49.8"/>

    <line x1="14.2" y1="49.8" x2="19.8" y2="44.2"/>
    <line x1="44.2" y1="19.8" x2="49.8" y2="14.2"/>
  </g>

  <!-- Glow -->
  <circle cx="32"
          cy="32"
          r="12"
          fill="#FFD54F"
          opacity="0.25"
          filter="url(#glow)"/>

  <!-- Main Sun -->
  <circle cx="32"
          cy="32"
          r="10.5"
          fill="url(#sunGradient)"
          stroke="#F9A825"
          stroke-width="2"/>

  <!-- Highlight -->
  <ellipse cx="28"
           cy="28"
           rx="3.5"
           ry="2.2"
           fill="#FFFFFF"
           opacity="0.45"/>
</svg>